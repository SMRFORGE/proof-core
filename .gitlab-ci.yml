# CI for the proof-core Claude Code plugin. bin/proof_core and bin/proof_verify are vendored verbatim from
# gitlab.com/proof-core/proof-core (the plugin cannot pip-install at load time). Gates:
#   vendored  -- bin/ is byte-identical to upstream at the commit VENDORED.md records (blocking)
#   smoke     -- the vendored packages import, the CLIs start from bin/ with no install, and the behaviour the
#                docs describe holds (tools/check_behaviour.py) (blocking)
#   freshness -- the recorded commit is the latest proof-core release tag (warning only)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# Images are pinned by digest so a commit always builds against the same image. To refresh one:
#   docker buildx imagetools inspect <image:tag>   (copy the top-level Digest)
default:
  image: python:3.11-slim@sha256:673719e071ecf27434fd2635bbd8d00f49f4fdd81f243143438a42ced8bedf60
  interruptible: true
  tags: [proof-core]          # run only on the proof-core group self-hosted runner

variables:
  PROOF_CORE_URL: https://gitlab.com/proof-core/proof-core.git
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

stages: [check]

.git:
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git diffutils
    - PC_SHA=$(grep -m1 -oE 'main commit:\*\* *[0-9a-f]{7,40}' VENDORED.md | grep -oE '[0-9a-f]{7,40}$' | head -1 || true)

vendored:
  stage: check
  extends: .git
  script:
    - sh tools/check_vendored.sh "$PROOF_CORE_URL" "$PC_SHA" proof_core:bin/proof_core proof_verify:bin/proof_verify

smoke:
  stage: check
  script:
    - PYTHONPATH=bin python -c "import proof_core, proof_verify; print('proof_core', proof_core.__version__)"
    - PYTHONPATH=bin python -P -m proof_verify --help > /dev/null
    - PYTHONPATH=bin python -P -m proof_core --help > /dev/null   # the entry point SKILL.md documents
    - python -P tools/check_behaviour.py   # the behaviour SKILL.md / README describe (envelopes, reproduce exit 7)

freshness:
  stage: check
  extends: .git
  allow_failure: true
  script:
    - git clone --quiet "$PROOF_CORE_URL" /tmp/pc   # FULL clone: describe --tags and short-SHA rev-parse need history
    - TAG=$(git -C /tmp/pc describe --tags --abbrev=0 origin/main)
    - echo "latest release $TAG = $(git -C /tmp/pc rev-parse --short "$TAG^{commit}"); vendored = $PC_SHA"
    - test "$(git -C /tmp/pc rev-parse "$TAG^{commit}")" = "$(git -C /tmp/pc rev-parse "$PC_SHA^{commit}")"

image-pins:
  # Monthly (scheduled pipelines only): report any pinned image whose tag now points at a newer digest, so the
  # pins get refreshed for security patches. Advisory: it never blocks a merge.
  stage: check
  image: python:3.11-slim@sha256:673719e071ecf27434fd2635bbd8d00f49f4fdd81f243143438a42ced8bedf60
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
  before_script: []
  script:
    - python tools/check_image_pins.py .gitlab-ci.yml
